[project]
name = "preop-triage"
version = "1.0.0"
description = "Cadence pre-op scheduling triage: LLM extracts, code decides"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0.0",
    "pydantic>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "textual>=1.0.0",
    "rich>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
